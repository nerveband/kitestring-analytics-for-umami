services:
  database:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: password
      MARIADB_ROOT_PASSWORD: password
    volumes:
      - database:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 2s
      timeout: 5s
      retries: 60
  wordpress:
    image: wordpress:php${PHP_VERSION:-8.3}-apache
    ports:
      - "127.0.0.1:${WP_PORT:-8888}:80"
    environment: &wordpress-environment
      WORDPRESS_DB_HOST: database
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: password
      WORDPRESS_CONFIG_EXTRA: "define('WP_ENVIRONMENT_TYPE', 'development');"
    volumes: &wordpress-volumes
      - wordpress:/var/www/html
      - .:/var/www/html/wp-content/plugins/simply-analytics-for-umami:ro
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost/wp-admin/install.php"]
      interval: 2s
      timeout: 5s
      retries: 60
  cli:
    image: wordpress:cli-php8.3
    user: "33:33"
    environment:
      <<: *wordpress-environment
      HOME: /tmp
    volumes: *wordpress-volumes
    entrypoint: ["sh", "-c", "while true; do sleep 3600; done"]
    depends_on:
      wordpress:
        condition: service_healthy
volumes:
  database:
  wordpress:
